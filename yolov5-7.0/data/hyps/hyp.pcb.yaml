# YOLOv5 hyperparameters - PCB Defect Detection
# 6 classes, small defects, ~4.5k training samples
# Anti-overfitting, small object optimization

# learning rate & optimizer
lr0: 0.01
lrf: 0.01
momentum: 0.937
weight_decay: 0.001       # increased for stronger regularization

# warmup
warmup_epochs: 3.0
warmup_momentum: 0.8
warmup_bias_lr: 0.1

# loss weights
box: 0.10                 # doubled for small defect localization
cls: 0.70                 # increased for subtle inter-class differences
cls_pw: 1.0
obj: 1.0
obj_pw: 1.0
iou_t: 0.20
anchor_t: 4.0
fl_gamma: 0.0
label_smoothing: 0.05     # label smoothing to prevent overconfidence

# data augmentation
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
degrees: 5.0              # rotation for generalization
translate: 0.15
scale: 0.6                # wider scale range
shear: 2.0                # slight shear
perspective: 0.0
flipud: 0.1               # vertical flip (PCB symmetric)
fliplr: 0.5
mosaic: 1.0
mixup: 0.3                # mixup for anti-overfitting
copy_paste: 0.0
